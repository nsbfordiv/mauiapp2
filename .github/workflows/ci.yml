name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Diagnostics
        run: dotnet --info; dotnet --list-sdks; dotnet --list-runtimes

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Keep workloads aligned with SDK
      - name: Update workloads
        run: dotnet workload update

      # Install Windows + Android so Mono runtime packs are resolvable if encountered
      - name: Install MAUI workloads
        run: dotnet workload install maui maui-windows maui-android

      # Microsoft feed where some .NET 10 workload/runtime packs live
      - name: Add dotnet-public feed
        run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json --name dotnet-public --store-password-in-clear-text

      # IMPORTANT: make this project effectively single‑TFM during CI (Windows only)
      # and do a workload restore that honors the manifests for this project
      - name: Workload restore (Windows only)
        run: dotnet workload restore .\MauiApp2\MauiApp2.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64

      # Restore (Windows target only) — single TFM, no RID
      - name: Restore (Windows target only)
        run: dotnet restore .\MauiApp2\MauiApp2.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RestoreSources="https://api.nuget.org/v3/index.json;https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json" -p:WorkloadRestore=true

      # Build (Windows) — NO RID here to avoid runtime pack resolution during build
      - name: Build (Windows)
        run: dotnet build .\MauiApp2\MauiApp2.csproj -c Release -p:TargetFramework=net10.0-windows10.0.19041.0 --no-restore

      # Publish (Windows) — include the RID & R2R here
      - name: Publish (Windows, R2R, no symbol package)
        run: dotnet publish .\MauiApp2\MauiApp2.csproj -c Release -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true -p:AppxSymbolPackageEnabled=false --no-restore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauiapp2-win-x64
          path: .\MauiApp2\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\
          
  build-api:
    runs-on: ubuntu-latest
    needs: [build-windows]  # remove this line if you want parallel jobs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Restore API
        run: dotnet restore ./Cw.Notes.Api/Cw.Notes.Api.csproj

      - name: Build API
        run: dotnet build ./Cw.Notes.Api/Cw.Notes.Api.csproj -c Release --no-restore

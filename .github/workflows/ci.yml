name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  # ============================================================
  #  Windows MAUI build/publish (net10.0-windows)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    env:
      # Ensure dotnet uses en-US invariant for logs (optional)
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Diagnostics
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      # Cache speeds up restore; safe with MSBuild property restore
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # MAUI workloads are NOT preinstalled on GitHub runners.
      - name: Install MAUI workloads
        run: dotnet workload install maui maui-windows

      # If you ever hit NU1102 for Mono packs again, uncomment to add dotnet-public:
      # - name: Add dotnet-public feed (workaround for specific runtime packs)
      #   run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json --name dotnet-public --store-password-in-clear-text

      # IMPORTANT: Use MSBuild properties (-p:TargetFramework / -p:RuntimeIdentifier)
      # Do NOT use --framework/--runtime here; those are CLI switches that get mis-forwarded on Windows.
      - name: Restore (Windows target only)
        shell: pwsh
        run: |
          dotnet restore .\MauiApp2\MauiApp2.csproj `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64

      - name: Build (Windows)
        shell: pwsh
        run: |
          dotnet build .\MauiApp2\MauiApp2.csproj `
            -c Release `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64 `
            --no-restore

      # R2R kept ON per your preference; disable Appx symbols package to silence mspdbcmf warning
      # If you want Packaged (MSIX), add: -p:WindowsPackageType=MSIX
      # If you prefer Unpackaged, ensure your csproj excludes the Windows manifest as we discussed.
      - name: Publish (Windows, R2R, no symbol package)
        shell: pwsh
        run: |
          dotnet publish .\MauiApp2\MauiApp2.csproj `
            -c Release `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64 `
            -p:PublishReadyToRun=true `
            -p:AppxSymbolPackageEnabled=false `
            --no-restore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauiapp2-win-x64
          path: |
            .\MauiApp2\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\

  # ============================================================
  #  (Optional) API build (fast on Ubuntu)
  # ============================================================
  build-api:
    runs-on: ubuntu-latest
    needs: [build-windows]  # make it depend on Windows build, or remove if independent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Restore API
        run: dotnet restore ./Cw.Notes.Api/Cw.Notes.Api.csproj

      - name: Build API
        run: dotnet build ./Cw.Notes.Api/Cw.Notes.Api.csproj -c Release --no-restore

name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Diagnostics
        run: dotnet --info; dotnet --list-sdks; dotnet --list-runtimes

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install MAUI workloads
        run: dotnet workload install maui maui-windows

      # If you hit NU1102/NETSDK1112 for runtime/workload packs, temporarily add dotnet-public:
      # - name: Add dotnet-public feed (workaround for some packs)
      #   run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json --name dotnet-public --store-password-in-clear-text

      - name: Restore (Windows target only)
        run: dotnet restore .\MauiApp2\MauiApp2.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64

      - name: Build (Windows)
        run: dotnet build .\MauiApp2\MauiApp2.csproj -c Release -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 --no-restore

      - name: Publish (Windows, R2R, no symbol package)
        run: dotnet publish .\MauiApp2\MauiApp2.csproj -c Release -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true -p:AppxSymbolPackageEnabled=false --no-restore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauiapp2-win-x64
          path: .\MauiApp2\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\

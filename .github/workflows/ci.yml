name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Diagnostics
        run: dotnet --info; dotnet --list-sdks; dotnet --list-runtimes

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Keep workloads aligned with SDK feature band and install Windows MAUI.
      # Sources added to avoid pack discovery failures on clean runners.
      - name: Update workloads (with sources)
        run: dotnet workload update --source https://api.nuget.org/v3/index.json --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json

      - name: Install MAUI workloads (Windows only)
        run: dotnet workload install maui maui-windows --source https://api.nuget.org/v3/index.json --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json

      - name: Add dotnet-public feed
        run: dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json --name dotnet-public --store-password-in-clear-text

      # Restore Windows TFM only (no RID) to avoid runtime-pack needs during "build" phase.
      # We let "publish" use the RID and pull any required runtime packs.
      - name: Restore (Windows target only)
        run: dotnet restore .\MauiApp2\MauiApp2.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:WorkloadRestore=true -p:RestoreSources="https://api.nuget.org/v3/index.json;https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json"

      # No separate Build step: publish compiles & packages.
      - name: Publish (Windows, R2R, no symbol package)
        run: dotnet publish .\MauiApp2\MauiApp2.csproj -c Release -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true -p:AppxSymbolPackageEnabled=false

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauiapp2-win-x64
          path: .\MauiApp2\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\

  # Optional: fast API build on Linux
  build-api:
    runs-on: ubuntu-latest
    needs: [build-windows]  # remove if you want both jobs in parallel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.102
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.102"

      - name: Restore API
        run: dotnet restore ./Cw.Notes.Api/Cw.Notes.Api.csproj

      - name: Build API
        run: dotnet build ./Cw.Notes.Api/Cw.Notes.Api.csproj -c Release --no-restore
